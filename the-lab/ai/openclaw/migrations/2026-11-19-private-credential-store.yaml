# One-shot migration: make OpenClaw's private stores private again.
#
# Not rendered by Helm or ArgoCD — only `templates/` is. Apply by hand.
#
# With fsGroup 1000 on the pod, kubelet widens every directory and file of
# the Longhorn volume to group rwx (dirs 2770, files 660) whenever it walks
# the volume. OpenClaw 2026.11.5 refuses to open its private stores with
# any group or other bit set (src/infra/client-credential-store.ts:
# `(mode & 0o077) !== 0` -> "Client credential directory is unsafe."), and
# init-doctor exits 1 at the state-schema step, before its own mode
# restore (restorePrivateStateStoreModes) can run.
#
# This sets the enumerated private stores back to 0700 / 0600:
#   <stateDir>/client   (credentials.sqlite and sidecars)
#   <stateDir>/control  (services.sqlite and sidecars), when it exists
#
# It does NOT touch the volume root. The root has to stay group-owned and
# at least 2770 so `fsGroupChangePolicy: OnRootMismatch` keeps skipping the
# walk that widens these paths. The Job pod deliberately sets no fsGroup,
# for the same reason: kubelet applies fsGroup, and its walk, on mount.
#
# Runs as the owner (uid 1024), so chmod needs no capabilities, and a file
# owned by anyone else fails the Job instead of being changed.
#
# Preconditions:
#   1. The pod is on pi-homelab-master-2.local, where openclaw-data
#      (longhorn-local, RWO) is attached. RWO allows a second pod on the
#      same node. If this Job stays Pending, scale deploy/openclaw to 0,
#      run it, then scale back to 1.
#   2. Do not delete the stuck pod afterwards. The next init-doctor retry
#      is a container restart, which does not re-mount the volume. A new
#      pod mounts it again and kubelet may walk it if the root mode
#      changed.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-private-credential-store
  namespace: openclaw
spec:
  backoffLimit: 0
  template:
    metadata:
      name: openclaw-private-credential-store
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: pi-homelab-master-2.local
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chmod
          # renovate datasource=docker depName=busybox
          image: busybox:1.38
          securityContext:
            runAsUser: 1024
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              echo "volume root (left unchanged):"
              stat -c '%a %u:%g %n' /data

              for name in client control; do
                dir="/data/$name"
                if [ ! -d "$dir" ] || [ -L "$dir" ]; then
                  echo "$dir: not a directory, skipping"
                  continue
                fi

                echo "--- $dir before ---"
                stat -c '%a %u:%g %n' "$dir"
                find "$dir" -type f -exec stat -c '%a %u:%g %n' {} +

                chmod 700 "$dir"
                find "$dir" -type f -exec chmod 600 {} +

                echo "--- $dir after ---"
                stat -c '%a %u:%g %n' "$dir"
                find "$dir" -type f -exec stat -c '%a %u:%g %n' {} +

                left=$(find "$dir" ! -type l -perm /077 | wc -l)
                echo "$dir: entries with group or other bits: $left"
                [ "$left" -eq 0 ]
              done
              echo OK
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
