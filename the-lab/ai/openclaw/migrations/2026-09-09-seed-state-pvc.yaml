# One-shot migration: seed the Longhorn `openclaw-state` PVC from the NFS
# home volume, then replace NFS `state/` with a symlink into a uid-1000
# directory on the sibling volume (not the mount root).
#
# Not rendered by Helm or ArgoCD — only `templates/` is. Apply by hand.
#
# Sidecar mounts, not a nested overlay: the gateway pod cannot see the NFS
# `state/` directory once it is a symlink into Longhorn, and a nested
# Longhorn mount on the export needs uid 0 (root squash). This Job mounts
# both volumes side by side, copies, then rewrites the NFS path.
#
# The symlink target is /home/node/.openclaw-state/db, not the volume root.
# OpenClaw chmod(state, 0700) follows the link; the fsGroup mount root is
# owned by uid 0, so chmod there is EPERM.
#
# Preconditions:
#   1. debug.enabled=true (gateway parked, SQLite quiescent).
#   2. persistence.state enabled at /home/node/.openclaw-state.
#   3. nodeName matches the node holding the attached RWO volumes:
#        kubectl -n openclaw get pod -o wide
#
# After it completes, set debug.enabled=false.
# If a previous run linked at the mount root, apply
# migrations/2026-09-10-retarget-state-dir.yaml instead of re-running this.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-seed-state
  namespace: openclaw
spec:
  backoffLimit: 0 # A partial copy needs inspection, not a blind retry.
  template:
    metadata:
      name: openclaw-seed-state
    spec:
      restartPolicy: Never
      # RWO volumes admit multiple pods only on the node they are attached to.
      nodeName: pi-homelab-master-2.local
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seed
          # renovate datasource=docker depName=busybox
          image: busybox:1.38
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              want=/home/node/.openclaw-state/db
              if [ -L /nfs/state ] && [ "$(readlink /nfs/state)" = "$want" ]; then
                echo "Already migrated: /nfs/state -> $want"
                exit 0
              fi

              if [ -s /new/db/openclaw.sqlite ] || [ -s /new/openclaw.sqlite ]; then
                echo "REFUSING: sqlite already exists on the Longhorn volume."
                echo "The volume has already been seeded, or the gateway ran unparked."
                echo "If the symlink still points at the mount root, apply"
                echo "migrations/2026-09-10-retarget-state-dir.yaml instead."
                exit 1
              fi

              echo "--- source (NFS) ---"
              ls -lan /nfs/state/

              mkdir -m 0700 /new/db

              if [ -f /nfs/state/openclaw.sqlite ]; then
                # Parked gateway: quiescent SQLite, plain copy cannot tear WAL.
                cp -a /nfs/state/openclaw.sqlite /new/db/
                for sidecar in openclaw.sqlite-wal openclaw.sqlite-shm; do
                  if [ -f "/nfs/state/$sidecar" ]; then
                    cp -a "/nfs/state/$sidecar" /new/db/
                    echo "copied $sidecar"
                  fi
                done

                src=$(md5sum /nfs/state/openclaw.sqlite | awk '{print $1}')
                dst=$(md5sum /new/db/openclaw.sqlite | awk '{print $1}')
                echo "src md5=$src"
                echo "dst md5=$dst"
                if [ "$src" != "$dst" ]; then
                  echo "FAILED: md5 mismatch"
                  exit 1
                fi
              else
                echo "No openclaw.sqlite on the share; Longhorn stays empty."
              fi

              chmod 0700 /new/db

              echo "--- destination (Longhorn) ---"
              ls -lan /new/db/

              echo "--- swapping NFS state/ for a symlink ---"
              mv /nfs/state /nfs/state.nfs-migrated-2026-09-10
              ln -s "$want" /nfs/state
              echo "link: $(ls -ln /nfs/state)"

              echo "OK"
          volumeMounts:
            - name: nfs
              mountPath: /nfs
              readOnly: false
            - name: state
              mountPath: /new
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: openclaw-home-nfs
        - name: state
          persistentVolumeClaim:
            claimName: openclaw-state
