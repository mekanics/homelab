openclaw:
  image:
    repository: ghcr.io/mekanics/openclaw-image
    # renovate: datasource=docker depName=ghcr.io/mekanics/openclaw-image
    tag: '2026.9.7-slim@sha256:47a20286f717ea7a00582974f955e4b2e6fe4616a318b0982beda4ae77f935ef'

  # Park the gateway (sleep infinity) so `openclaw doctor --fix` and
  # `openclaw backup create` can take the state ownership lock. Home PVC is
  # ReadWriteOnce — this replaces the gateway, it is not a second pod.
  # Chart 0.4.0+ honours this.
  debug:
    enabled: true

  # Default policy is Always, which rewrites every file on each volume at
  # every start. The state volume now holds the whole home, and that walk is
  # slow enough for kubelet to warn. OnRootMismatch skips it when the root is
  # already group-owned and at least 2770. Doctor may still chmod the root to
  # 700; the following start walks once and restores 2770. That is safe
  # because the mount is the volume itself, not an NFS subPath.
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch

  env:
    - name: TZ
      value: Europe/Zurich
    - name: OPENCLAW_DISABLE_BONJOUR
      value: '1'
    - name: GIT_CONFIG_GLOBAL
      value: /home/node/.openclaw/workspace/config/gitconfig
    # Playwright (if custom image)
    # - name: PLAYWRIGHT_BROWSERS_PATH
    #   value: /home/node/.cache/ms-playwright
    # Tell V8 its heap ceiling so it doesn't OOM-panic on ARM64 during cold start.
    # Without this, V8 picks a conservative default and crashes when it can't grow.
    # 3072 leaves ~1Gi headroom under the 4Gi limit for non-heap RSS (native
    # modules, buffers) and for the node children the gateway spawns — they
    # inherit NODE_OPTIONS, so this is a per-process ceiling, not a total.
    - name: NODE_OPTIONS
      value: '--max-old-space-size=3072'
    - name: UV_THREADPOOL_SIZE
      value: '128'
    # Skip the entry-point self-respawn (saves ~50-100MB peak RSS at startup).
    - name: OPENCLAW_NO_RESPAWN
      value: '1'
    # Persist V8's module compile cache across restarts (stored on Longhorn PVC).
    # After the first cold start, Node skips re-parsing 4000+ JS files — meaningful
    # on ARM64 where JS compilation is CPU/memory intensive.
    - name: NODE_COMPILE_CACHE
      value: /home/node/.node-compile-cache
    # State lives on longhorn-local (openclaw-data), not the NFS home.
    # Doctor chmods this directory to 700 whenever group/other bits are
    # set, and a nested mount under the NFS home then fails: kubelet is
    # root, the export squashes root, and mode 700 is not traversable.
    # The volume mount itself is on the container rootfs, so 700 is fine.
    # Agents are real directories here; do not put them back behind a
    # symlink or an NFS subPath.
    - name: OPENCLAW_STATE_DIR
      value: /home/node/.openclaw-state
  persistence:
    home:
      existingClaim: openclaw-home-nfs
    compile-cache:
      enabled: true
      type: pvc
      mountPath: /home/node/.node-compile-cache
      readOnly: false
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 1Gi
      retain: true
    # OPENCLAW_STATE_DIR. Control-plane state/ (formerly db/), the
    # per-agent agents/ tree, and the rest of the home copied off NFS
    # on 2026-09-25, then off 2-replica longhorn on 2026-09-27.
    # migrations/2026-09-09-seed-state-pvc.yaml,
    # migrations/2026-09-21-seed-agents-pvc.yaml,
    # migrations/2026-09-27-seed-local-state.yaml.
    #
    # longhorn-local, one replica on pi-homelab-master-2. A second
    # replica on the Pi 4 made every fsync wait on it (median p99
    # 12.6ms vs 5.7ms local; sqlite 7.8s vs 2.4s). Must not go back
    # onto NFS: WAL needs a -shm file, and nocto + actimeo=600 hide
    # the attribute changes SQLite relies on.
    #
    # One Volume for this claim. A second Volume entry leaves the pod
    # Pending with no attach event. Do not subPath-mount agents or
    # state under the NFS home: doctor will chmod the directory to 700
    # and the next start cannot lstat the mountpoint.
    #
    # The 2026-09-21 agents migration left every agent registered twice
    # in agent_databases — once relative (written by the migration) and
    # once absolute (rewritten on every startup) — because upstream
    # derives the state dir as `db/` and so never relativises. Stale
    # rows removed 2026-09-24 (19 -> 10). Expect duplicates back after
    # any future migration that writes relative paths:
    #   DELETE FROM agent_databases WHERE path NOT LIKE '/%' AND EXISTS (
    #     SELECT 1 FROM agent_databases b
    #     WHERE b.agent_id = agent_databases.agent_id AND b.path LIKE '/%');
    data:
      enabled: true
      type: pvc
      mountPath: /home/node/.openclaw-state
      readOnly: false
      storageClass: longhorn-local
      accessMode: ReadWriteOnce
      size: 10Gi
      retain: true
      extraLabels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/default: enabled
        recurring-job.longhorn.io/backup-every-8h: enabled
        recurring-job.longhorn.io/backup-weekly: enabled
        recurring-job.longhorn.io/backup-monthly: enabled
    # Pre-migration 2-replica claim. Kept for 7 days after a Completed
    # backup of openclaw-data, then delete the PVC and its Longhorn
    # volume. Rollback: enabled true, data.enabled false. Argo prune
    # would drop this the moment it leaves the manifest — the live
    # object has argocd.argoproj.io/sync-options: Prune=false.
    # helm.sh/resource-policy: keep is not enough.
    state:
      enabled: false
      type: pvc
      mountPath: /home/node/.openclaw-state
      readOnly: false
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 10Gi
      retain: true
      extraLabels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/default: enabled
        recurring-job.longhorn.io/backup-every-8h: enabled
        recurring-job.longhorn.io/backup-weekly: enabled
        recurring-job.longhorn.io/backup-monthly: enabled
    # 2026.9.6 stages plugin builds under OPENCLAW_STATE_DIR/tmp/plugin-captures,
    # not /tmp. An emptyDir here keeps those trees off the snapshotted PVC.
    # Mount last: overlaying tmp/ hides leftover captures on the volume.
    state-tmp:
      enabled: true
      type: emptyDir
      mountPath: /home/node/.openclaw-state/tmp
      sizeLimit: 8Gi
  # Container /tmp for npm/uv caches and anything that still honours TMPDIR.
  # Plugin captures for 2026.9.6 live on persistence.state-tmp instead.
  # 8Gi is disk-backed emptyDir, not RAM; a crash loop evicts the pod.
  tmpDir:
    enabled: true
    sizeLimit: 8Gi
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: mekanics-ca-issuer
      hajimari.io/group: AI
      hajimari.io/appName: OpenClaw
      hajimari.io/icon: robot
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
      # Injects X-Forwarded-User for trusted-proxy auth without requiring snippet annotations.
      # References the ConfigMap in templates/proxy-headers-configmap.yaml.
      nginx.ingress.kubernetes.io/proxy-set-headers: openclaw/openclaw-proxy-headers
      nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    hosts:
      - host: &host openclaw.mekanics.ch
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls-certificate
        hosts:
          - *host

  # Do not lower cpu back to 1. Cold start needs ~1.3-1.4 cores for a few
  # minutes — plugin-registry resolution, provider catalog prep, and opening 19
  # agent databases (user_version + integrity checks). Capped at 1 core it can
  # never finish that warmup inside its quota, so it livelocks: the event loop
  # stalls, the liveness/memory diagnostics fire continuously, and session
  # bookkeeping queues behind work that never drains. Observed stuck that way
  # for 29h straight — 83% of all scheduling periods throttled, 11.4h of stall,
  # pinned at 100% of quota with active=0 waiting=0 queued=0 the whole time. A
  # restart does not help; it is just another cold start into the same trap.
  #
  # At limit 2 the same build warms up in ~5min and then idles at 4% of one
  # core with throttling essentially gone (2 of 535 periods). Request 1 matches
  # real steady-state scheduling need and stops the scheduler bin-packing
  # against a 250m request the pod exceeded 4x.
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      memory: 4Gi
      cpu: '2'

  priorityClassName: high-priority-homelab

  probes:
    # Chart 0.5.2 drops exec when httpGet is set. `exec: null` alone does not:
    # Argo CD strips the null before Helm merges the chart default back in.
    startup:
      spec:
        exec: null
        httpGet:
          path: /healthz
          port: 18789
        failureThreshold: 60
        periodSeconds: 10
        timeoutSeconds: 5
    # Deliberately tolerant: the 03:00 memory-dreaming run blocks the event
    # loop for ~37s, and restarting mid-run costs a cold start on top of the
    # readiness gap. 10 x 30s rides the stall out; readiness below is what
    # takes the pod out of rotation while it's unresponsive.
    liveness:
      spec:
        exec: null
        httpGet:
          path: /healthz
          port: 18789
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
    # Loopback exec, not kubelet httpGet. Live openclaw.json (PVC) trusts
    # the Cilium pod CIDR of the node that currently runs ingress-nginx
    # (pi-homelab = 10.0.0.0/24). The browser is SNATed to another
    # node's Cilium IP (10.0.3.36), so that client hop stays
    # attributable. Do not list every node CIDR and do not use
    # 10.0.0.0/8 — those swallow the SNATed client and 403. Do not
    # change ingress-nginx traffic policy for this. Helm does not own
    # this file. After the controller moves to another node:
    #   kubectl -n openclaw exec deploy/openclaw -c gateway -- \
    #     openclaw config set gateway.trustedProxies \
    #     '["10.0.0.0/24"]' \
    #     --strict-json --replace
    #
    # 2026-09-22: Codex session catalog is off on the live PVC config
    # (`plugins.entries.codex.config.sessionCatalog.enabled=false`), on the
    # theory that 2026.9.5 walks cold catalog pages while idle. Plugin and
    # harness stay on. Helm does not own this file — init-config only seeds
    # when openclaw.json is missing.
    #
    # 2026-09-23: this was never the cause of the CPU burn — that was the
    # 1-core limit starving cold start (see resources below). Also ruled out
    # while chasing it: heap exhaustion (heap 600-780MiB against a 3072MiB
    # ceiling), the daily 10:14 integrity verification, a looping memory
    # reindex (memory_index_state.revision static), and stuck-session
    # recovery. Turning sessionCatalog back on should be safe, but note what
    # was and was not measured: it stayed off for the whole investigation, so
    # what is proven is that it is not required to cause the burn — not that
    # it costs nothing. Re-enable as an isolated change and watch cpu.stat for
    # a day before assuming it is free. Re-enable:
    #   kubectl -n openclaw exec deploy/openclaw -c gateway -- \
    #     openclaw config set plugins.entries.codex.config.sessionCatalog.enabled true \
    #     --strict-json
    #   kubectl -n openclaw rollout restart deploy/openclaw
    #
    # To CPU-profile the gateway, see diagnostics/cpu-profile.mjs. Do not
    # `kill -USR1 1` to open the inspector: OpenClaw traps SIGUSR1 as its own
    # restart signal, so it restarts the gateway (~7s drain plus a cold start)
    # and never binds 9229. Set --inspect=127.0.0.1:9229 on `gateway.command`
    # instead of NODE_OPTIONS — the ~6 Codex children and the node-based
    # readiness probe inherit NODE_OPTIONS and would collide on 9229.
    #
    # Official plugins live on the home PVC (~/.openclaw/npm), not in the image,
    # so they drift from the gateway independently. `openclaw plugins list`
    # shows installed versions; `gateway status --deep` names the drift.
    #
    # Two traps here, both learned the hard way on 2026-09-24:
    #
    # 1. Do NOT use `plugins update <id>`. It installs npm latest, which runs
    #    ahead of this image — acpx was already 2026.9.7 on npm while the
    #    gateway was 2026.9.5, so "update" widens the drift it is meant to
    #    close. Pin to the gateway version instead:
    #      openclaw plugins install @openclaw/acpx@<gateway version>
    #
    # 2. Do NOT install against a running gateway. The build needs ~2Gi of its
    #    own anonymous memory while the gateway already holds ~2.2Gi, which does
    #    not fit the 4Gi limit — the kernel OOM-killed the gateway mid-install
    #    (2026-09-24), and a prior attempt at 4Gi tmp was evicted on disk. Note
    #    that exporting NPM_CONFIG_CACHE / NPM_CONFIG_TMP / TMPDIR in the exec
    #    shell does not help: the build runs in the gateway process, not the
    #    CLI, and stages under OPENCLAW_STATE_DIR/tmp (state-tmp emptyDir).
    #
    #    Park the gateway first (debug.enabled=true → sleep infinity), which
    #    frees both the memory and the state lock, then install and unpark:
    #      # set debug.enabled: true above, commit, let ArgoCD sync
    #      kubectl -n openclaw exec deploy/openclaw -c gateway -- \
    #        openclaw plugins install @openclaw/acpx@2026.9.5
    #      # set debug.enabled back to false, commit, let ArgoCD sync
    #    Watch headroom while it runs:
    #      kubectl -n openclaw exec deploy/openclaw -c gateway -- sh -c \
    #        'du -sh /tmp; cat /sys/fs/cgroup/memory.current'
    # /startupz (not /readyz) comes from chart 0.5.0+ as a loopback exec.
    # Homelab only overrides timings so an event-loop stall still drops
    # the pod from Service endpoints quickly.
    readiness:
      spec:
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2

  nodeSelector:
    node.homelab.io/performance: high
    node.homelab.io/generation: pi5
    # Durable state is longhorn-local on this node's NVMe. A second replica
    # on the Pi 4 is what made every fsync wait ~4ms. Node down means
    # OpenClaw is down until it returns or a NAS backup is restored.
    kubernetes.io/hostname: pi-homelab-master-2.local
