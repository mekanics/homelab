openclaw:
  image:
    repository: ghcr.io/mekanics/openclaw-image
    # renovate: datasource=docker depName=ghcr.io/mekanics/openclaw-image
    tag: '2026.9.5-slim@sha256:2e297aaf99181b87204a238e6714cbedc89549e74dcb4a40a03a9373ee54291a'

  # Park the gateway (sleep infinity) so `openclaw doctor --fix` and
  # `openclaw backup create` can take the state ownership lock. Home PVC is
  # ReadWriteOnce — this replaces the gateway, it is not a second pod.
  # Chart 0.4.0+ honours this.
  debug:
    enabled: false

  env:
    - name: TZ
      value: Europe/Zurich
    - name: OPENCLAW_DISABLE_BONJOUR
      value: '1'
    - name: GIT_CONFIG_GLOBAL
      value: /home/node/.openclaw/workspace/config/gitconfig
    # Playwright (if custom image)
    # - name: PLAYWRIGHT_BROWSERS_PATH
    #   value: /home/node/.cache/ms-playwright
    # Tell V8 its heap ceiling so it doesn't OOM-panic on ARM64 during cold start.
    # Without this, V8 picks a conservative default and crashes when it can't grow.
    # 3072 leaves ~1Gi headroom under the 4Gi limit for non-heap RSS (native
    # modules, buffers) and for the node children the gateway spawns — they
    # inherit NODE_OPTIONS, so this is a per-process ceiling, not a total.
    - name: NODE_OPTIONS
      value: '--max-old-space-size=3072'
    - name: UV_THREADPOOL_SIZE
      value: '128'
    # Skip the entry-point self-respawn (saves ~50-100MB peak RSS at startup).
    - name: OPENCLAW_NO_RESPAWN
      value: '1'
    # Persist V8's module compile cache across restarts (stored on Longhorn PVC).
    # After the first cold start, Node skips re-parsing 4000+ JS files — meaningful
    # on ARM64 where JS compilation is CPU/memory intensive.
    - name: NODE_COMPILE_CACHE
      value: /home/node/.node-compile-cache
  persistence:
    home:
      existingClaim: openclaw-home-nfs
    compile-cache:
      enabled: true
      type: pvc
      mountPath: /home/node/.node-compile-cache
      readOnly: false
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 1Gi
      retain: true
    # Longhorn sibling volume for SQLite. Must not live on the NFS home volume:
    # WAL needs a -shm file NFS cannot provide, and nocto + actimeo=600 hide
    # the attribute changes SQLite relies on.
    #
    # Holds both control-plane db/ and the per-agent agents/ tree. NFS
    # `.openclaw/state` and `.openclaw/agents` are symlinks into uid-1000
    # child dirs on this volume — not the mount root. OpenClaw chmod(0700)
    # follows those links; the fsGroup mount root is owned by uid 0, so
    # chmod there is EPERM (migrations/2026-09-09-seed-state-pvc.yaml,
    # migrations/2026-09-21-seed-agents-pvc.yaml).
    #
    # Sibling mount, not nested under `home`. kubelet would resolve a nested
    # mount target as uid 0, and the Synology export squashes root.
    state:
      enabled: true
      type: pvc
      mountPath: /home/node/.openclaw-state
      readOnly: false
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 10Gi
      retain: true
  # Integrity-check / compile scratch. 1Gi and 2Gi both evicted the gateway.
  tmpDir:
    enabled: true
    sizeLimit: 4Gi
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: mekanics-ca-issuer
      hajimari.io/group: AI
      hajimari.io/appName: OpenClaw
      hajimari.io/icon: robot
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
      # Injects X-Forwarded-User for trusted-proxy auth without requiring snippet annotations.
      # References the ConfigMap in templates/proxy-headers-configmap.yaml.
      nginx.ingress.kubernetes.io/proxy-set-headers: openclaw/openclaw-proxy-headers
      nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    hosts:
      - host: &host openclaw.mekanics.ch
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls-certificate
        hosts:
          - *host

  # Do not lower cpu back to 1. Cold start needs ~1.3-1.4 cores for a few
  # minutes — plugin-registry resolution, provider catalog prep, and opening 19
  # agent databases (user_version + integrity checks). Capped at 1 core it can
  # never finish that warmup inside its quota, so it livelocks: the event loop
  # stalls, the liveness/memory diagnostics fire continuously, and session
  # bookkeeping queues behind work that never drains. Observed stuck that way
  # for 29h straight — 83% of all scheduling periods throttled, 11.4h of stall,
  # pinned at 100% of quota with active=0 waiting=0 queued=0 the whole time. A
  # restart does not help; it is just another cold start into the same trap.
  #
  # At limit 2 the same build warms up in ~5min and then idles at 4% of one
  # core with throttling essentially gone (2 of 535 periods). Request 1 matches
  # real steady-state scheduling need and stops the scheduler bin-packing
  # against a 250m request the pod exceeded 4x.
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      memory: 4Gi
      cpu: '2'

  priorityClassName: high-priority-homelab

  probes:
    startup:
      spec:
        exec: null
        httpGet:
          path: /healthz
          port: 18789
        failureThreshold: 60
        periodSeconds: 10
        timeoutSeconds: 5
    # Deliberately tolerant: the 03:00 memory-dreaming run blocks the event
    # loop for ~37s, and restarting mid-run costs a cold start on top of the
    # readiness gap. 10 x 30s rides the stall out; readiness below is what
    # takes the pod out of rotation while it's unresponsive.
    liveness:
      spec:
        exec: null
        httpGet:
          path: /healthz
          port: 18789
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
    # Loopback exec, not kubelet httpGet. Live openclaw.json (PVC) must list
    # only the ingress-nginx controller pod IP in gateway.trustedProxies — not
    # 10.0.0.0/8. That supernet also covers kubelet/Cilium host IPs and
    # SNATed clients, which OpenClaw then cannot attribute (403).
    # After an ingress-nginx reschedule, replace the /32 and restart:
    #   NGINX_IP=$(kubectl -n ingress-nginx get pods -l app.kubernetes.io/component=controller -o jsonpath='{.items[0].status.podIP}')
    #   kubectl -n openclaw exec deploy/openclaw -c gateway -- \
    #     openclaw config set gateway.trustedProxies "[\"$NGINX_IP\"]" --strict-json --replace
    #   kubectl -n openclaw rollout restart deploy/openclaw
    #
    # 2026-09-22: Codex session catalog is off on the live PVC config
    # (`plugins.entries.codex.config.sessionCatalog.enabled=false`), on the
    # theory that 2026.9.5 walks cold catalog pages while idle. Plugin and
    # harness stay on. Helm does not own this file — init-config only seeds
    # when openclaw.json is missing.
    #
    # 2026-09-23: this was never the cause of the CPU burn — that was the
    # 1-core limit starving cold start (see resources below). Also ruled out
    # while chasing it: heap exhaustion (heap 600-780MiB against a 3072MiB
    # ceiling), the daily 10:14 integrity verification, a looping memory
    # reindex (memory_index_state.revision static), and stuck-session
    # recovery. So sessionCatalog can be turned back on whenever wanted; it
    # is unrelated. Re-enable:
    #   kubectl -n openclaw exec deploy/openclaw -c gateway -- \
    #     openclaw config set plugins.entries.codex.config.sessionCatalog.enabled true \
    #     --strict-json
    #   kubectl -n openclaw rollout restart deploy/openclaw
    #
    # To CPU-profile the gateway, see diagnostics/cpu-profile.mjs. Do not
    # `kill -USR1 1` to open the inspector: OpenClaw traps SIGUSR1 as its own
    # restart signal, so it restarts the gateway (~7s drain plus a cold start)
    # and never binds 9229. Set --inspect=127.0.0.1:9229 on `gateway.command`
    # instead of NODE_OPTIONS — the ~6 Codex children and the node-based
    # readiness probe inherit NODE_OPTIONS and would collide on 9229.
    #
    # Official plugins live on the home PVC (~/.openclaw/npm), not in the
    # image. After an image bump, update drifted ids then roll the deploy.
    # npm stages under /tmp and will evict the 4Gi tmp EmptyDir unless
    # cache and tmp both sit on the home volume:
    #   kubectl -n openclaw exec deploy/openclaw -c gateway -- sh -c '
    #     mkdir -p /home/node/.openclaw/.npm-cache /home/node/.openclaw/.npm-tmp
    #     export NPM_CONFIG_CACHE=/home/node/.openclaw/.npm-cache
    #     export NPM_CONFIG_TMP=/home/node/.openclaw/.npm-tmp
    #     export TMPDIR=/home/node/.openclaw/.npm-tmp
    #     openclaw plugins update acpx
    #     openclaw plugins update perplexity
    #     openclaw plugins update slack
    #   '
    #   kubectl -n openclaw rollout restart deploy/openclaw
    # /startupz (not /readyz) comes from chart 0.5.0+ as a loopback exec.
    # Homelab only overrides timings so an event-loop stall still drops
    # the pod from Service endpoints quickly.
    readiness:
      spec:
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2

  nodeSelector:
    node.homelab.io/performance: high
    node.homelab.io/generation: pi5
