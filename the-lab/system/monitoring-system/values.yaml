# https://github.com/VictoriaMetrics/helm-charts/blob/victoria-metrics-k8s-stack-0.93.0/charts/victoria-metrics-k8s-stack/values.yaml
victoria-metrics-k8s-stack:
  argocdReleaseOverride: monitoring-system
  # Default fullname is monitoring-system-victoria-metrics-k8s-stack. That
  # makes the Alertmanager controller-revision-hash 70 chars; Kubernetes
  # rejects the pod at 63.
  nameOverride: vm

  defaultRules:
    groups:
      kube-prometheus-general.rules:
        rules:
          # count(up == 0) emits nothing while every target is up, and
          # RecordingRulesNoData treats that silence as a broken rule.
          'count:up0':
            enabled: false

  # https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
  grafana:
    enabled: true
    # Argo templates this chart off-cluster, so Helm lookup() cannot keep the
    # existing admin secret. Pin the password Grafana's sqlite already has
    # (the 58.x chart default) or the sidecar 401s and login drifts.
    adminPassword: prom-operator
    defaultDashboardsTimezone: Europe/Zurich
    forceDeployDatasources: true

    plugins:
      - grafana-clock-panel
      - fetzerch-sunandmoon-datasource

    sidecar:
      dashboards:
        folderAnnotation: grafana_folder
        # kube-prometheus-stack defaulted this to ALL. The Grafana chart
        # otherwise watches only monitoring-system, so the Waid (influx)
        # and CNPG dashboard ConfigMaps never reach Grafana.
        searchNamespace: ALL

    grafana.ini:
      server:
        root_url: https://grafana.mekanics.ch
      date_formats:
        default_timezone: Europe/Zurich

    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: mekanics-ca-issuer
        hajimari.io/group: Monitoring
        hajimari.io/appName: Grafana
        hajimari.io/icon: chart-bar
      hosts:
        - &grafanaHost grafana.mekanics.ch
      tls:
        - secretName: grafana-general-tls
          hosts:
            - *grafanaHost

    initChownData:
      enabled: false

    resources:
      requests:
        memory: 384Mi
      limits:
        memory: 768Mi

    # RWO NFS claim cannot attach to two pods, so RollingUpdate wedges.
    # rollingUpdate: null is required so Argo SSA drops the live field;
    # Kubernetes rejects Recreate when rollingUpdate is still set.
    deploymentStrategy:
      type: Recreate
      rollingUpdate: null

    persistence:
      enabled: true
      type: pvc
      existingClaim: nfs-monitoring-grafana

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
                - key: node.homelab.io/storage-type
                  operator: In
                  values: ['ssd']

  defaultDatasources:
    victoriametrics:
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          uid: prometheus
          isDefault: true
    extra:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki:3100
      - name: Sun and Moon
        type: fetzerch-sunandmoon-datasource
        access: proxy
        basicAuth: false
        editable: true
        jsonData:
          latitude: 47.39
          longitude: 8.52

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: 30d
      resources:
        # 512Mi OOMs under ~330k series plus vmalert query fan-out;
        # old Prometheus sat at ~880Mi RSS for the same scrape set.
        requests:
          memory: 512Mi
        limits:
          memory: 1Gi
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-local
        resources:
          requests:
            storage: 10Gi
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node.homelab.io/storage-type
                    operator: In
                    values: ['ssd']

  vmagent:
    enabled: true
    spec:
      selectAllByDefault: true
      scrapeInterval: 30s
      resources:
        # Operator default is a 200m quota. vmagent sizes itself from that
        # (process_cpu_cores_available=0.2) and CFS stalls every scrape.
        # One whole core is the smallest limit that does not fractional-throttle,
        # and it still caps a scrape storm on the 4-core control-plane node.
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          cpu: '1'
          memory: 500Mi

  vmalert:
    enabled: true
    spec:
      selectAllByDefault: true
      evaluationInterval: 30s

  alertmanager:
    enabled: true
    useManagedConfig: false
    spec:
      replicaCount: 1
      selectAllByDefault: true
      externalURL: https://alertmanager.mekanics.ch
      secrets:
        - alertmanager-slack-secret
      resources:
        limits:
          memory: 64Mi
        requests:
          memory: 32Mi
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: mekanics-ca-issuer
        hajimari.io/group: Monitoring
        hajimari.io/appName: Alertmanager
        hajimari.io/icon: bell-alert
      hosts:
        - &amHost alertmanager.mekanics.ch
      tls:
        - secretName: alertmanager-general-tls
          hosts:
            - *amHost
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: slack-default
        routes:
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor|KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
            receiver: 'null'
          - matchers:
              - severity = critical
            receiver: slack-critical
          - matchers:
              - severity = warning
            receiver: slack-warning
      receivers:
        - name: 'null'
        - name: slack-default
          slack_configs:
            - api_url_file: /etc/vm/secrets/alertmanager-slack-secret/webhookUrl
              channel: '#the-dark-side'
              title: '{{ template "slack.default.title" . }}'
              text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
              send_resolved: true
        - name: slack-critical
          slack_configs:
            - api_url_file: /etc/vm/secrets/alertmanager-slack-secret/webhookUrl
              channel: '#the-dark-side'
              title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
              text: '{{ range .Alerts }}*Summary:* {{ .Annotations.summary }}\n*Description:* {{ .Annotations.description }}\n{{ end }}'
              send_resolved: true
        - name: slack-warning
          slack_configs:
            - api_url_file: /etc/vm/secrets/alertmanager-slack-secret/webhookUrl
              channel: '#the-dark-side'
              title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}'
              text: '{{ range .Alerts }}*Summary:* {{ .Annotations.summary }}\n{{ end }}'
              send_resolved: true
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity = warning
          equal: ['alertname', 'namespace']

  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  kubeApiServer:
    enabled: true
  coreDns:
    enabled: true

prometheus-operator-crds: {}
