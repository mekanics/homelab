{{- range $index, $stack := .Values.stacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $stack.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  generators:
    - git:
        repoURL: {{ $.Values.gitops.repo }}
        revision: {{ $.Values.gitops.revision }}
        directories:
          - path: the-lab/{{ $stack.name }}/*
          - path: the-lab/{{ $stack.name }}/_*
            exclude: true
  
  template:
    metadata:
      name: '{{ `{{path.basename}}` }}'
      labels:
        group: {{ $stack.name }}
      {{- if $stack.syncWave }}
      annotations:
        argocd.argoproj.io/sync-wave: "{{ $stack.syncWave }}"
      {{- end }}
    
    spec:
      project: default
      
      source:
        repoURL: {{ $.Values.gitops.repo }}
        targetRevision: {{ $.Values.gitops.revision }}
        path: '{{ `{{path}}` }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ default `{{path.basename}}` $stack.namespace }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        
        retry:
          limit: 10
          backoff:
            duration: 1m
            factor: 2
            maxDuration: 16m
        
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - ServerSideDiff=true
          - RespectIgnoreDifferences=true

      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - '.spec.volumeClaimTemplates[]?.metadata.creationTimestamp'

        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

        # Argo SSA of Longhorn CRDs merges conversion into an invalid
        # state (empty strategy + leftover webhookClientConfig) and
        # then never updates spec.versions. That left 1.9.2 Volume
        # schemas in place and crashed the 1.10.2 managers.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion

{{- end }}